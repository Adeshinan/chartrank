# Golden pairs (task 1.4): 30 reference cases to check the ★ against human choices.
#
# - data: file in tests/data/ ; x, y, intent: arguments of cr.suggest()
# - human_star: chart kind chosen by most testers (filled by `golden.py fill`)
# - notes: why the pair is interesting
#
# Testers see the charts of each pair WITHOUT the ★ and in a shuffled order
# (see golden.py): the answers go in answers.csv.

# --- Titanic (891 passengers) ------------------------------------------------
- id: titanic_fare_by_class
  data: titanic.csv
  x: Pclass
  y: Fare
  intent: compare
  human_star: null
  notes: "Fare is very skewed (4.79): the mean is misleading"
- id: titanic_age_by_sex
  data: titanic.csv
  x: Sex
  y: Age
  intent: compare
  human_star: null
  notes: "Two groups, 20 % missing ages"
- id: titanic_fare_by_port
  data: titanic.csv
  x: Embarked
  y: Fare
  intent: compare
  human_star: null
  notes: "Unbalanced groups (Q is small)"
- id: titanic_age_distribution_by_sex
  data: titanic.csv
  x: Sex
  y: Age
  intent: distribution
  human_star: null
  notes: "Shape of the age distribution in each group"
- id: titanic_age_distribution_by_class
  data: titanic.csv
  x: Pclass
  y: Age
  intent: distribution
  human_star: null
  notes: "Three groups of different sizes"
- id: titanic_age_fare
  data: titanic.csv
  x: Age
  y: Fare
  intent: relationship
  human_star: null
  notes: "Weak relationship, skewed y"
- id: titanic_sex_port
  data: titanic.csv
  x: Sex
  y: Embarked
  intent: composition
  human_star: null
  notes: "Two categories"
- id: titanic_class_survival
  data: titanic.csv
  x: Pclass
  y: Survived
  intent: compare
  human_star: null
  notes: "Boolean drawn as a category"
- id: titanic_fare_survival
  data: titanic.csv
  x: Fare
  y: Survived
  intent: compare
  human_star: null
  notes: "Numeric x boolean row"
- id: titanic_age_survival
  data: titanic.csv
  x: Age
  y: Survived
  intent: compare
  human_star: null
  notes: "Numeric x boolean, missing ages"

