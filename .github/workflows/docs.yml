name: Docs

# Build the site on every pull request (to catch broken pages early)
# and publish it to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[docs]"
      - name: Build (strict)
        run: mkdocs build --strict
      - name: Upload site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    # Only after a merge into main, never from a pull request.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write     # publish to GitHub Pages
      id-token: write  # prove to Pages that this workflow is allowed to publish
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
