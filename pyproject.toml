# ---------------------------------------------------------------------------
# Build system: which tool turns the source tree into an installable package.
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Package metadata (PEP 621): what PyPI and pip read.
# ---------------------------------------------------------------------------
[project]
name = "chartrank"
dynamic = ["version"]  # read from src/chartrank/__init__.py (see [tool.hatch.version])
description = "Suggests and explains the right chart for your data and intent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Faïd Adéshinan ALAGBE" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.24",
    "pyyaml>=6.0",
]
keywords = ["data-visualization", "plotly", "pandas", "eda", "chart-recommendation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]

[project.optional-dependencies]
static = ["kaleido>=1.0"]  # PNG / SVG export
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-socket>=0.7",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "chartrank[docs]",  # dev also installs the docs tools
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
]

[project.urls]
Homepage = "https://github.com/Adeshinan/chartrank"
Issues = "https://github.com/Adeshinan/chartrank/issues"
Changelog = "https://github.com/Adeshinan/chartrank/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Hatchling settings
# ---------------------------------------------------------------------------
[tool.hatch.version]
path = "src/chartrank/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chartrank"]

# ---------------------------------------------------------------------------
# Tools
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["docs/spec"]  # reference documents, not project code

[tool.ruff.lint]
# E/W: style, F: real errors, I: import order, UP: modern syntax, B: likely bugs
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --disable-socket"  # no network during tests (ENF-05)

[tool.coverage.run]
source = ["chartrank"]
branch = true
